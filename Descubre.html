<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>¿Qué energía tienes hoy? — Moonreya</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #f7d9ff 0%, transparent 30%),
        radial-gradient(circle at 80% 20%, #d9e9ff 0%, transparent 30%),
        linear-gradient(160deg, #fff8fc, #eee9ff);
      color: #3d3150;
      padding: 25px 18px 40px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .top {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .logo span {
      color: #9d75d8;
    }

    .moon {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff7a8, #ffdff4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      box-shadow: 0 12px 30px rgba(125, 91, 170, 0.18);
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.75;
    }

    .progress {
      margin: 25px 0 15px;
      text-align: center;
      font-size: 14px;
      opacity: 0.7;
    }

    .bar {
      height: 9px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .bar-fill {
      height: 100%;
      width: 14.28%;
      background: #9d75d8;
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .question {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      padding: 25px 20px;
      box-shadow: 0 12px 30px rgba(80, 55, 110, 0.1);
    }

    .question h2 {
      font-size: 22px;
      line-height: 1.3;
      margin-bottom: 20px;
      text-align: center;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 16px;
      background: #faf7ff;
      color: #3d3150;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .answer:hover {
      transform: translateY(-2px);
      border-color: #c5a7e8;
      background: #ffffff;
    }

    .result {
      display: none;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(80, 55, 110, 0.12);
    }

    .result-icon {
      font-size: 65px;
      margin-bottom: 12px;
    }

    .result h2 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .result p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.82;
    }

    .buttons {
      display: grid;
      gap: 12px;
      margin-top: 25px;
    }

    .main-button {
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      background: #9d75d8;
      color: white;
    }

    .secondary-button {
      border: 2px solid #d5c2ee;
      border-radius: 18px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: #5a4375;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #7654a0;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <div class="logo">
        Moon<span>reya</span> ✦
      </div>

      <div class="moon">
        ⭐
      </div>

      <h1>¿Qué energía tienes hoy?</h1>

      <p class="subtitle">
        Responde estas preguntas y descubre qué energía Moonreya
        aparece en ti hoy.
      </p>
    </div>

    <div id="quiz">

      <div class="progress">
        Pregunta <span id="questionNumber">1</span> de 7
      </div>

      <div class="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>

      <div class="question">

        <h2 id="questionText"></h2>

        <div class="answers" id="answers"></div>

      </div>

    </div>

    <div class="result" id="result">

      <div class="result-icon" id="resultIcon"></div>

      <h2 id="resultTitle"></h2>

      <p id="resultText"></p>

      <div class="buttons">

        <button class="main-button" onclick="shareResult()">
          Compartir mi resultado
        </button>

        <button class="secondary-button" onclick="restartQuiz()">
          Hacerlo otra vez
        </button>

      </div>

    </div>

    <a class="back" href="index.html">
      ← Volver a Moonreya
    </a>

  </div>

  <script>

    const questions = [

      {
        question: "Tienes una tarde completamente libre. ¿Qué haces?",
        answers: [
          ["Me quedo tranquila haciendo algo que disfruto.", "moon"],
          ["Busco algo nuevo para probar.", "star"],
          ["Escribo o hablo con alguien que quiero.", "heart"],
          ["Me pierdo en música, historias o imaginación.", "dream"]
        ]
      },

      {
        question: "Cuando algo despierta tu curiosidad...",
        answers: [
          ["Lo observo primero y pienso bastante.", "moon"],
          ["Quiero descubrirlo inmediatamente.", "star"],
          ["Quiero comentarlo con alguien.", "heart"],
          ["Empiezo a imaginar todas las posibilidades.", "dream"]
        ]
      },

      {
        question: "¿Qué lugar elegirías para desconectarte?",
        answers: [
          ["Un lugar tranquilo bajo la luna.", "moon"],
          ["Un sitio donde pueda explorar.", "star"],
          ["Un lugar bonito para compartir con alguien.", "heart"],
          ["Un rincón lleno de libros, música o arte.", "dream"]
        ]
      },

      {
        question: "Tus amigos suelen buscarte cuando necesitan...",
        answers: [
          ["Alguien que escuche sin juzgar.", "moon"],
          ["Una idea diferente.", "star"],
          ["Cariño y compañía.", "heart"],
          ["Una perspectiva creativa.", "dream"]
        ]
      },

      {
        question: "¿Cuál de estas palabras te representa más hoy?",
        answers: [
          ["Calma", "moon"],
          ["Aventura", "star"],
          ["Conexión", "heart"],
          ["Imaginación", "dream"]
        ]
      },

      {
        question: "Si pudieras aprender algo ahora mismo...",
        answers: [
          ["Algo sobre mí misma.", "moon"],
          ["Algo completamente nuevo.", "star"],
          ["Algo que pueda compartir con otros.", "heart"],
          ["Algo artístico o creativo.", "dream"]
        ]
      },

      {
        question: "Al final del día, ¿qué sensación te gustaría tener?",
        answers: [
          ["Sentir que tuve paz.", "moon"],
          ["Sentir que descubrí algo.", "star"],
          ["Sentir que conecté con alguien.", "heart"],
          ["Sentir que soñé despierta.", "dream"]
        ]
      }

    ];

    let currentQuestion = 0;

    let scores = {
      moon: 0,
      star: 0,
      heart: 0,
      dream: 0
    };

    function showQuestion() {

      const question = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        currentQuestion + 1;

      document.getElementById("questionText").textContent =
        question.question;

      const answersContainer =
        document.getElementById("answers");

      answersContainer.innerHTML = "";

      question.answers.forEach(function(answer) {

        const button = document.createElement("button");

        button.className = "answer";

        button.textContent = answer[0];

        button.onclick = function() {
          selectAnswer(answer[1]);
        };

        answersContainer.appendChild(button);

      });

      const percentage =
        ((currentQuestion + 1) / questions.length) * 100;

      document.getElementById("barFill").style.width =
        percentage + "%";
    }

    function selectAnswer(type) {

      scores[type]++;

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {

      document.getElementById("quiz").style.display = "none";

      document.getElementById("result").style.display = "block";

      let winner = "moon";

      if (scores.star > scores[winner]) {
        winner = "star";
      }

      if (scores.heart > scores[winner]) {
        winner = "heart";
      }

      if (scores.dream > scores[winner]) {
        winner = "dream";
      }

      const results = {

        moon: {
          icon: "🌙",
          title: "Alma Lunar",
          text: "Tienes una energía tranquila y observadora. Sueles valorar los momentos de calma, pensar antes de actuar y descubrir cosas a tu propio ritmo."
        },

        star: {
          icon: "✨",
          title: "Estrella Curiosa",
          text: "Tu energía está llena de curiosidad. Te atraen las experiencias nuevas, las ideas diferentes y todo aquello que te permita descubrir algo."
        },

        heart: {
          icon: "💗",
          title: "Corazón Brillante",
          text: "Tu energía se mueve hacia la conexión. Valoras el cariño, las conversaciones y esos pequeños momentos que se vuelven especiales cuando se comparten."
        },

        dream: {
          icon: "🌸",
          title: "Aura Soñadora",
          text: "Tu imaginación tiene mucho espacio. Te inspiran las historias, la creatividad y las posibilidades que aparecen cuando dejas volar tus ideas."
        }

      };

      document.getElementById("resultIcon").textContent =
        results[winner].icon;

      document.getElementById("resultTitle").textContent =
        results[winner].title;

      document.getElementById("resultText").textContent =
        results[winner].text;

      window.currentResult =
        results[winner].title;
    }

    function restartQuiz() {

      currentQuestion = 0;

      scores = {
        moon: 0,
        star: 0,
        heart: 0,
        dream: 0
      };

      document.getElementById("result").style.display = "none";

      document.getElementById("quiz").style.display = "block";

      showQuestion();
    }

    function shareResult() {

      const text =
        "Mi resultado en Moonreya es: " +
        window.currentResult +
        " ✨";

      if (navigator.share) {

        navigator.share({
          title: "Mi resultado en Moonreya",
          text: text,
          url: window.location.href
        });

      } else {

        navigator.clipboard.writeText(
          text + " " + window.location.href
        );

        alert("¡Resultado copiado! Ahora puedes compartirlo.");

      }
    }

    showQuestion();

  </script>

</body>
  </html>
